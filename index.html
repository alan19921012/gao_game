<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cooking Mama - Gao Game Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #gameContainer {
            position: relative;
            width: 96vw;
            height: 72vw;
            max-width: 800px;
            max-height: 600px;
            background-color: #000;
            box-shadow: 0 0 35px rgba(0,0,0,0.95);
            overflow: hidden;
            touch-action: none;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background-size: cover;
            background-position: center;
            background-image: url('images/bg_start.jpg'), url('bg_start.jpg');
            background-color: #222;
            cursor: pointer;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="startScreen"></div>
    <canvas id="gameCanvas"></canvas>
</div>

<audio id="bgm" loop preload="auto" playsinline webkit-playsinline>
    <source src="images/bgm.mp3" type="audio/mpeg">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<script>
function initGame() {
    const canvas = document.getElementById('gameCanvas');
    const startScreen = document.getElementById('startScreen');
    const bgm = document.getElementById('bgm');
    const container = document.getElementById('gameContainer');

    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');

    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 600;
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    let audioCtx = null;

    function loadRobustImage(baseName) {
        const img = new Image();
        const sources = [
            `images/${baseName}.jpg.jpg`,
            `images/${baseName}.jpg`,
            `./images/${baseName}.jpg`,
            `${baseName}.jpg.jpg`,
            `${baseName}.jpg`
        ];
        let srcIdx = 0;

        img.onload = () => { img.isReady = true; };
        img.onerror = () => {
            srcIdx++;
            if (srcIdx < sources.length) {
                img.src = sources[srcIdx];
            }
        };
        img.src = sources[0];
        return img;
    }

    const bgImg1 = loadRobustImage('bg_1');
    const bgImg2 = loadRobustImage('bg_2');
    const bgImg3 = loadRobustImage('bg_3');

    let currentBgImg = bgImg1;

    function initAudioContext() {
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch(e) {}
    }

    function startBGM() {
        initAudioContext();
        if (!bgm) return;
        bgm.volume = 0.45;
        
        try {
            bgm.currentTime = 0;
            const playPromise = bgm.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    const unlock = () => {
                        bgm.play().catch(() => {});
                        window.removeEventListener('pointerdown', unlock);
                        window.removeEventListener('touchstart', unlock);
                    };
                    window.addEventListener('pointerdown', unlock, { once: true });
                    window.addEventListener('touchstart', unlock, { once: true });
                });
            }
        } catch(e) {}
    }

    function stopBGM() {
        if (bgm && !bgm.paused) {
            try { bgm.pause(); } catch(e) {}
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopBGM();
        } else if (gameStarted && !gameOver) {
            if (bgm && bgm.paused) bgm.play().catch(() => {});
        }
    });

    window.addEventListener('blur', stopBGM);
    window.addEventListener('focus', () => {
        if (gameStarted && !gameOver && bgm && bgm.paused) bgm.play().catch(() => {});
    });

    let score = 0;
    let lives = 3;
    const maxLives = 3;
    let gameStarted = false;
    let gameOver = false;
    let gameOverLockTime = 0;

    let comboCount = 0;
    let isFever = false;
    let feverTimer = 0;
    let isCoolingDown = false;
    let screenShake = 0;

    let items = [];
    let slicedPieces = [];
    let explosions = [];
    let floatingTexts = [];
    let knifeSlash = null;

    let animTimer1 = null;
    let animTimer2 = null;
    let lastTime = Date.now();

    function playSound(type) {
        try {
            initAudioContext();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'slash') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'heal' || type === 'fever') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(783, now + 0.16);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        } catch(e) {}
    }

    function drawCleanBackground() {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        if (screenShake > 0) {
            const rx = (Math.random() - 0.5) * screenShake * 2;
            const ry = (Math.random() - 0.5) * screenShake * 2;
            ctx.translate(rx, ry);
            screenShake *= 0.82;
            if (screenShake < 0.5) screenShake = 0;
        }

        if (currentBgImg && (currentBgImg.isReady || (currentBgImg.complete && currentBgImg.naturalWidth !== 0))) {
            ctx.drawImage(currentBgImg, 0, 0, GAME_WIDTH, GAME_HEIGHT);
        } else {
            ctx.fillStyle = '#1e1b2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        ctx.restore();
    }

    function drawPixelBox(x, y, w, h, bgColor, borderColor, shadowColor = '#000000', pixelSize = 4) {
        ctx.save();
        ctx.fillStyle = shadowColor;
        ctx.fillRect(x + pixelSize, y + pixelSize, w, h);
        ctx.fillStyle = bgColor;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = borderColor;
        ctx.fillRect(x, y, w, pixelSize); 
        ctx.fillRect(x, y + h - pixelSize, w, pixelSize); 
        ctx.fillRect(x, y, pixelSize, h); 
        ctx.fillRect(x + w - pixelSize, y, pixelSize, h); 
        ctx.restore();
    }

    function drawPixelText(text, x, y, color = '#ffffff', fontSize = 24, align = 'center', strokeColor = '#000000') {
        ctx.save();
        ctx.font = `bold ${fontSize}px "Courier New", Courier, monospace`;
        ctx.textAlign = align;

        if (fontSize >= 36) {
            ctx.lineWidth = 6;
            ctx.strokeStyle = strokeColor;
            ctx.strokeText(text, x, y);
            ctx.fillStyle = '#000000';
            ctx.fillText(text, x + 4, y + 4);
        } else {
            ctx.fillStyle = strokeColor;
            ctx.fillText(text, x + 3, y + 3);
        }

        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    class FloatingText {
        constructor(text, x, y, color, fontSize = 36) {
            this.text = text;
            this.x = x;
            this.y = y;
            this.color = color;
            this.fontSize = fontSize;
            this.opacity = 1.0;
        }
        update() {
            this.y -= 1.8;
            this.opacity -= 0.020;
        }
        draw() {
            if (this.opacity <= 0) return;
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.opacity);
            drawPixelText(this.text, this.x, this.y, this.color, this.fontSize, 'center', '#000000');
            ctx.restore();
        }
    }

    class FoodItem {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH / 2 + (Math.random() * 320 - 160);
            this.y = GAME_HEIGHT + 40;
            this.vx = (Math.random() - 0.5) * 4.5;
            
            let targetY = GAME_HEIGHT * (0.28 + Math.random() * 0.32);
            targetY = Math.max(130, targetY);

            this.gravity = 0.34;
            const dist = GAME_HEIGHT + 40 - targetY;
            let initialVy = -Math.sqrt(2 * this.gravity * dist);

            if (isFever) {
                initialVy *= (1.1 + Math.random() * 0.25);
            }

            this.vy = initialVy;
            this.isSliced = false;
            this.glowTimer = 0;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.glowTimer += 0.12;
        }

        draw() {
            if (this.isSliced) return;
            ctx.save();
            ctx.imageSmoothingEnabled = false;
            ctx.translate(Math.round(this.x), Math.round(this.y));
            ctx.scale(1.7, 1.7);

            if (this.type.includes('tomato')) {
                if (this.type === 'golden_tomato') {
                    const alpha = 0.4 + Math.sin(this.glowTimer) * 0.25;
                    ctx.save();
                    ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = `rgba(255, 245, 157, ${alpha + 0.2})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                let mainColor = '#d50000';
                let highlightColor = '#ff8a80';
                let stemColor = '#1b5e20';

                if (this.type === 'golden_tomato') {
                    mainColor = '#e53935';
                    highlightColor = '#fff59d';
                    stemColor = '#76ff03';
                } else if (this.type === 'rotten_tomato') {
                    mainColor = '#6a1b29';
                    highlightColor = '#a73a4b';
                    stemColor = '#33691e';
                }

                ctx.fillStyle = stemColor;
                ctx.fillRect(-6, -22, 12, 6);
                ctx.fillRect(-3, -25, 6, 4);

                ctx.fillStyle = '#000000';
                ctx.fillRect(-21, -16, 42, 32);
                ctx.fillRect(-16, -21, 32, 42);

                ctx.fillStyle = mainColor;
                ctx.fillRect(-19, -14, 38, 28);
                ctx.fillRect(-14, -19, 28, 38);

                if (this.type === 'rotten_tomato') {
                    ctx.fillStyle = '#2d0812';
                    ctx.fillRect(-14, 2, 28, 17);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(-10, 8, 20, 10);
                }

                ctx.fillStyle = highlightColor;
                ctx.fillRect(-12, -12, 8, 8);
            } else if (this.type === 'dumpling') {
                ctx.fillStyle = '#000000';
                ctx.fillRect(-22, -8, 44, 20);
                ctx.fillRect(-18, -14, 36, 28);
                ctx.fillRect(-16, -18, 6, 6);
                ctx.fillRect(-6, -20, 6, 6);
                ctx.fillRect(4, -20, 6, 6);
                ctx.fillRect(12, -18, 6, 6);

                ctx.fillStyle = '#fffde7';
                ctx.fillRect(-20, -6, 40, 16);
                ctx.fillRect(-16, -12, 32, 22);

                ctx.fillStyle = '#fbc02d';
                ctx.fillRect(-16, 4, 32, 6);

                ctx.fillStyle = '#e6ee9c';
                ctx.fillRect(-14, -16, 4, 10);
                ctx.fillRect(-4, -18, 4, 12);
                ctx.fillRect(6, -18, 4, 12);
                ctx.fillRect(14, -16, 4, 10);

                ctx.fillStyle = '#afb42b';
                ctx.fillRect(-12, -14, 2, 8);
                ctx.fillRect(-2, -16, 2, 10);
                ctx.fillRect(8, -16, 2, 10);
            }

            ctx.restore();
        }
    }

    class Piece {
        constructor(x, y, isLeft, color) {
            this.x = x;
            this.y = y;
            this.vx = isLeft ? -5.5 : 5.5;
            this.vy = -3;
            this.gravity = 0.45;
            this.isLeft = isLeft;
            this.color = color;
            this.rotation = 0;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.rotation += this.isLeft ? -0.15 : 0.15;
        }

        draw() {
            ctx.save();
            ctx.imageSmoothingEnabled = false;
            ctx.translate(Math.round(this.x), Math.round(this.y));
            ctx.scale(1.7, 1.7);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            if (this.isLeft) {
                ctx.fillRect(-16, -16, 16, 32);
            } else {
                ctx.fillRect(0, -16, 16, 32);
            }
            ctx.restore();
        }
    }

    class ExplosionParticle {
        constructor(x, y, colorList = null, speedMult = 1.0) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 22 * speedMult;
            this.vy = (Math.random() - 0.5) * 22 * speedMult;
            this.size = Math.random() * 10 + 4;
            const colors = colorList || ['#d50000', '#ff1744', '#ff8a80', '#ffffff'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.life = Math.floor(Math.random() * 15 + 15);
            this.gravity = 0.28;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            this.life--;
        }

        draw() {
            if (this.life <= 0) return;
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.size, this.size);
            ctx.restore();
        }
    }

    let spawnTimer = 0;

    function handleItems(delta) {
        if (!gameStarted || gameOver) {
            for (let item of items) item.draw();
            for (let p of slicedPieces) p.draw();
            for (let ex of explosions) ex.draw();
            for (let ft of floatingTexts) ft.draw();
            return;
        }

        if (isFever) {
            feverTimer -= delta;
            if (feverTimer <= 0) {
                isFever = false;
                feverTimer = 0;
                comboCount = 0;
                isCoolingDown = true;
            }
        }

        if (isCoolingDown) {
            if (items.length === 0) {
                isCoolingDown = false;
                spawnTimer = 0;
            }
        }

        spawnTimer++;

        if (!isCoolingDown) {
            if (isFever) {
                if (spawnTimer >= 6) {
                    items.push(new FoodItem('tomato'));
                    if (Math.random() < 0.4) items.push(new FoodItem('tomato'));
                    spawnTimer = 0;
                }
            } else {
                if (items.length === 0 && spawnTimer > 35) {
                    const rand = Math.random();
                    let type = 'tomato';

                    if (rand < 0.10) {
                        type = 'golden_tomato';
                    } else if (rand < 0.25) {
                        type = 'rotten_tomato';
                    } else if (rand < 0.45) {
                        type = 'dumpling';
                    } else {
                        type = 'tomato';
                    }

                    items.push(new FoodItem(type));
                    spawnTimer = 0;
                }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.update();
            item.draw();
            if (item.y > GAME_HEIGHT + 60) {
                items.splice(i, 1);
            }
        }

        for (let i = slicedPieces.length - 1; i >= 0; i--) {
            let p = slicedPieces[i];
            p.update();
            p.draw();
            if (p.y > GAME_HEIGHT + 60) slicedPieces.splice(i, 1);
        }

        for (let i = explosions.length - 1; i >= 0; i--) {
            let ex = explosions[i];
            ex.update();
            ex.draw();
            if (ex.life <= 0) explosions.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.update();
            ft.draw();
            if (ft.opacity <= 0) floatingTexts.splice(i, 1);
        }
    }

    function trigger3FrameAnimation() {
        if (animTimer1) clearTimeout(animTimer1);
        if (animTimer2) clearTimeout(animTimer2);

        currentBgImg = bgImg2.isReady ? bgImg2 : bgImg1;

        animTimer1 = setTimeout(() => {
            currentBgImg = bgImg3.isReady ? bgImg3 : bgImg1;
            
            animTimer2 = setTimeout(() => {
                currentBgImg = bgImg1;
            }, 100);
        }, 80);
    }

    function swingKnife() {
        initAudioContext();

        if (!gameStarted) {
            gameStarted = true;
            if (startScreen) startScreen.style.display = 'none';
            startBGM();
            return;
        }

        if (gameOver) {
            if (gameOverLockTime <= 0) {
                resetGame();
                startBGM();
            }
            return;
        }

        if (bgm && bgm.paused) {
            bgm.play().catch(() => {});
        }

        playSound('slash');
        trigger3FrameAnimation();

        const slashAngleType = Math.floor(Math.random() * 3);
        knifeSlash = { opacity: 1.0, type: slashAngleType };

        let sliceableItems = [];
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            if (!item.isSliced && item.y > 40 && item.y < GAME_HEIGHT - 40) {
                sliceableItems.push({ item, index: i });
            }
        }

        let maxAllowedSlice = sliceableItems.length;
        if (isFever && sliceableItems.length > 1) {
            maxAllowedSlice = Math.ceil(sliceableItems.length * 0.7);
        }

        let slicedCount = 0;

        for (let obj of sliceableItems) {
            if (slicedCount >= maxAllowedSlice) break;

            let item = obj.item;
            let i = obj.index;
            item.isSliced = true;
            slicedCount++;

            const heightPercent = item.y / GAME_HEIGHT;
            let gradeMsg = "GOOD!";
            let gradeColor = "#ffea00";
            let multiplier = 1;

            if (heightPercent <= 0.25) {
                gradeMsg = "PERFECT!";
                gradeColor = "#00e676";
                multiplier = 3;
            } else if (heightPercent <= 0.50) {
                gradeMsg = "GREAT!";
                gradeColor = "#00b0ff";
                multiplier = 2;
            } else {
                gradeMsg = "GOOD!";
                gradeColor = "#ffea00";
                multiplier = 1;
            }

            if (item.type === 'tomato') {
                playSound('hit');
                const addedScore = 100 * multiplier;
                score += addedScore;

                if (isFever) {
                    screenShake = 10;
                    const tomatoColors = ['#d50000', '#ff1744', '#ff8a80', '#ffffff'];
                    for (let k = 0; k < 35; k++) {
                        explosions.push(new ExplosionParticle(item.x, item.y, tomatoColors, 1.4));
                    }
                }

                if (!isFever) {
                    comboCount++;
                    if (comboCount >= 17) {
                        isFever = true;
                        feverTimer = 5.0;
                        comboCount = 0;
                        screenShake = 18;
                        playSound('fever');
                        floatingTexts.push(new FloatingText("🔥 BREAK THE RULES! 🔥", GAME_WIDTH / 2, 230, '#ffea00', 52));
                    } else {
                        floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore}`, item.x, item.y - 30, gradeColor, 36));
                    }
                } else {
                    floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore}`, item.x, item.y - 30, gradeColor, 36));
                }

                slicedPieces.push(new Piece(item.x, item.y, true, '#d50000'));
                slicedPieces.push(new Piece(item.x, item.y, false, '#d50000'));
            } else if (item.type === 'golden_tomato') {
                playSound('heal');
                const addedScore = 300 * multiplier;
                score += addedScore;
                if (lives < maxLives) lives++;

                for (let k = 0; k < 25; k++) {
                    explosions.push(new ExplosionParticle(item.x, item.y, ['#ffea00', '#ffffff', '#ffd54f']));
                }

                if (!isFever) {
                    comboCount++;
                    if (comboCount >= 17) {
                        isFever = true;
                        feverTimer = 5.0;
                        comboCount = 0;
                        screenShake = 18;
                        playSound('fever');
                        floatingTexts.push(new FloatingText("🔥 BREAK THE RULES! 🔥", GAME_WIDTH / 2, 230, '#ffea00', 52));
                    } else {
                        floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore} ❤️`, item.x, item.y - 30, '#ff4081', 36));
                    }
                } else {
                    floatingTexts.push(new FloatingText(`${gradeMsg} +${addedScore} ❤️`, item.x, item.y - 30, '#ff4081', 36));
                }

                slicedPieces.push(new Piece(item.x, item.y, true, '#e53935'));
                slicedPieces.push(new Piece(item.x, item.y, false, '#e53935'));
            } else if (item.type === 'rotten_tomato') {
                playSound('explosion');
                lives--;
                comboCount = 0;
                floatingTexts.push(new FloatingText("BAD! -1 ❤️", item.x, item.y - 30, '#ff1744', 36));
                slicedPieces.push(new Piece(item.x, item.y, true, '#6a1b29'));
                slicedPieces.push(new Piece(item.x, item.y, false, '#6a1b29'));
                for (let k = 0; k < 20; k++) {
                    explosions.push(new ExplosionParticle(item.x, item.y, ['#6a1b29', '#2d0812', '#ff1744']));
                }
                if (lives <= 0) {
                    lives = 0;
                    gameOver = true;
                    gameOverLockTime = 2.5;
                    stopBGM();
                }
            } else if (item.type === 'dumpling') {
                playSound('explosion');
                lives--;
                comboCount = 0;
                floatingTexts.push(new FloatingText("BOMB! -1 ❤️", item.x, item.y - 30, '#ff1744', 36));
                for (let k = 0; k < 35; k++) {
                    explosions.push(new ExplosionParticle(item.x, item.y, ['#ff1744', '#ffea00', '#ff9100', '#ffffff']));
                }
                if (lives <= 0) {
                    lives = 0;
                    gameOver = true;
                    gameOverLockTime = 2.5;
                    stopBGM();
                }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            if (items[i].isSliced) {
                items.splice(i, 1);
            }
        }
    }

    function drawUI() {
        if (!gameStarted) return;

        drawPixelBox(20, 20, 260, 50, '#111111', '#ffffff', '#000000', 4);
        drawPixelText(`SCORE: ${score}`, 150, 52, '#ffffff', 22, 'center');

        let heartsStr = '';
        for (let i = 0; i < maxLives; i++) heartsStr += (i < lives) ? '❤️' : '🖤';
        const hpColor = lives <= 1 ? '#ff1744' : '#ffeb3b';
        drawPixelBox(GAME_WIDTH - 260, 20, 240, 50, '#111111', hpColor, '#000000', 4);
        drawPixelText(`HP: ${heartsStr}`, GAME_WIDTH - 140, 52, hpColor, 20, 'center');

        if (isFever) {
            const glowBorder = Math.floor(Date.now() / 100) % 2 === 0 ? '#ffea00' : '#ff1744';
            drawPixelBox(GAME_WIDTH / 2 - 170, 20, 340, 50, '#d50000', glowBorder, '#000000', 4);
            drawPixelText(`BREAK THE RULES: ${feverTimer.toFixed(1)}s`, GAME_WIDTH / 2, 52, '#ffea00', 20, 'center');
        } else if (comboCount > 0) {
            drawPixelText(`COMBO: ${comboCount}/17`, GAME_WIDTH / 2, 52, '#ffea00', 20, 'center');
        }

        if (knifeSlash) {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 255, 255, ${knifeSlash.opacity})`;
            ctx.lineWidth = 10;
            ctx.beginPath();

            if (knifeSlash.type === 0) {
                ctx.moveTo(80, GAME_HEIGHT - 100);
                ctx.lineTo(GAME_WIDTH - 80, 100);
            } else if (knifeSlash.type === 1) {
                ctx.moveTo(80, 100);
                ctx.lineTo(GAME_WIDTH - 80, GAME_HEIGHT - 100);
            } else {
                ctx.moveTo(50, GAME_HEIGHT / 2);
                ctx.lineTo(GAME_WIDTH - 50, GAME_HEIGHT / 2);
            }

            ctx.stroke();
            ctx.restore();

            knifeSlash.opacity -= 0.15;
            if (knifeSlash.opacity <= 0) knifeSlash = null;
        }

        if (gameOver) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawPixelBox(150, 150, 500, 300, '#111111', '#ff1744', '#000000', 6);
            drawPixelText('GAME OVER', GAME_WIDTH / 2, 230, '#ff1744', 44, 'center');
            drawPixelText(`FINAL SCORE: ${score}`, GAME_WIDTH / 2, 300, '#ffeb3b', 28, 'center');

            if (gameOverLockTime > 0) {
                drawPixelText(`WAIT ${gameOverLockTime.toFixed(1)}s...`, GAME_WIDTH / 2, 380, '#888888', 20, 'center');
            } else {
                drawPixelText('CLICK TO RESTART', GAME_WIDTH / 2, 380, '#ffffff', 20, 'center');
            }
        }
    }

    function resetGame() {
        score = 0;
        lives = 3;
        comboCount = 0;
        isFever = false;
        feverTimer = 0;
        isCoolingDown = false;
        screenShake = 0;
        gameOver = false;
        gameOverLockTime = 0;
        items = [];
        slicedPieces = [];
        explosions = [];
        floatingTexts = [];
        spawnTimer = 0;

        if (bgm) {
            try { bgm.currentTime = 0; } catch(e) {}
        }
    }

    function gameLoop() {
        const now = Date.now();
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawCleanBackground();

        handleItems(delta);

        if (gameOver && gameOverLockTime > 0) {
            gameOverLockTime = Math.max(0, gameOverLockTime - delta);
        }

        drawUI();

        requestAnimationFrame(gameLoop);
    }

    function handleInput(e) {
        if (e) e.preventDefault();
        swingKnife();
    }

    container.addEventListener('pointerdown', handleInput);

    gameLoop();
}

if (document.readyState === 'interactive' || document.readyState === 'complete') {
    initGame();
} else {
    document.addEventListener('DOMContentLoaded', initGame);
}
</script>

</body>
</html>
